<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dessin caché en hexadécimal</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2230;--muted:#5d6678;--line:#d9dde5;--accent:#2457d6;--accent-ink:#fff;--ok:#1b7f4b;--okbg:#e3f4ea;--ko:#b3261e;--kobg:#fbe7e5;--sep:#e27a22}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2c3342;--accent:#6c93ff;--accent-ink:#0d1220;--ok:#5fd394;--okbg:#17301f;--ko:#ff8a80;--kobg:#3a1c1a;--sep:#ff9d4d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:900px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:700px){.cols{grid-template-columns:1fr}}
.grid{display:grid;width:100%;max-width:440px;margin:0 auto;border:2px solid var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--card);cursor:pointer}
.cell.on{background:var(--ink)}
.cell.sep{border-right:2px dashed var(--sep)}
.cell.bad{outline:3px solid var(--ko);outline-offset:-3px}
.ro .cell{cursor:default}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:3px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.85rem}
td.m{font-family:ui-monospace,Menlo,Consolas,monospace}
td.hx{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:var(--accent);font-size:1.15rem}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
button,select,input[type=text]{font:inherit;color:var(--ink)}
button{padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
button.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
select,input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
label.f{display:block;font-weight:600;margin:12px 0 4px}
.msg{margin-top:10px;padding:10px 12px;border-radius:8px}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.ko{background:var(--kobg);color:var(--ko)}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
details{margin-top:12px}
summary{cursor:pointer;color:var(--muted)}
.hint{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div id="app"></div>
</main>
<script>
const HX = "0123456789ABCDEF";
const $ = s => document.querySelector(s);
const blank = n => Array.from({length:n}, () => Array(n).fill(0));
const rowHex = r => { let s=''; for (let i=0;i<r.length;i+=4) s += HX[r[i]*8+r[i+1]*4+r[i+2]*2+r[i+3]]; return s; };
const rowBin = r => r.map((b,i) => (i && i%4===0 ? ' ' : '') + b).join('');
const rowDec = r => parseInt(r.join(''), 2);
const allHex = c => c.map(rowHex).join('');

function parseHex(str, n){
  const clean = str.replace(/[^0-9a-fA-F]/g,'').toUpperCase(), per = n/4;
  if (clean.length !== per*n) return null;
  const out = [];
  for (let i=0;i<n;i++){
    const part = clean.slice(i*per,(i+1)*per);
    const bits = [...part].map(ch => HX.indexOf(ch).toString(2).padStart(4,'0')).join('');
    out.push([...bits].map(Number));
  }
  return out;
}
function fromPattern(p){ return p.map(s => [...s].map(Number)); }

const PRESETS = {
  "Smiley":["00111100","01000010","10100101","10000001","10100101","10011001","01000010","00111100"],
  "Cœur":["01100110","11111111","11111111","11111111","01111110","00111100","00011000","00000000"],
  "Maison":["00011000","00111100","01111110","11111111","11111111","11100111","11100111","11100111"],
  "Alien":["00011000","00111100","01111110","11011011","11111111","00100100","01011010","10100101"],
  "Chat":["10000001","11000011","11111111","10111101","11111111","11100111","01111110","00111100"],
  "Flèche":["00001000","00001100","11111110","11111111","11111110","00001100","00001000","00000000"],
  "Sapin":["00011000","00111100","01111110","00111100","01111110","11111111","00011000","00011000"]
};

function buildGrid(el, n, state, opts={}){
  el.innerHTML = '';
  el.style.gridTemplateColumns = `repeat(${n},1fr)`;
  el.classList.toggle('ro', !!opts.readonly);
  for (let i=0;i<n;i++) for (let j=0;j<n;j++){
    const d = document.createElement('div');
    d.className = 'cell' + (state[i][j] ? ' on' : '') + ((j%4===3 && j<n-1) ? ' sep' : '');
    el.appendChild(d);
  }
  if (opts.readonly) return;
  let paint = null;
  const cellAt = e => {
    const r = el.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x<0||x>=1||y<0||y>=1) return null;
    return [Math.floor(y*n), Math.floor(x*n)];
  };
  const apply = e => {
    const c = cellAt(e); if (!c) return;
    const [i,j] = c;
    if (state[i][j] === paint) return;
    state[i][j] = paint;
    el.children[i*n+j].classList.toggle('on', !!paint);
    el.children[i*n+j].classList.remove('bad');
    opts.onChange && opts.onChange();
  };
  el.onpointerdown = e => {
    const c = cellAt(e); if (!c) return;
    paint = state[c[0]][c[1]] ? 0 : 1;
    el.setPointerCapture(e.pointerId);
    apply(e);
  };
  el.onpointermove = e => { if (paint !== null) apply(e); };
  el.onpointerup = el.onpointercancel = () => { paint = null; };
}

/* ---------- Mode enseignant ---------- */
let N = 8, cells = fromPattern(PRESETS["Smiley"]);

function renderTeacher(){
  $('#title').textContent = "Générateur d'images en hexadécimal";
  $('#sub').textContent = "Dessinez sur la grille, récupérez les codes, puis donnez le lien aux élèves : ils retrouvent le dessin à partir des codes. Aucun compte, aucune donnée enregistrée.";
  $('#app').innerHTML = `
  <div class="card cols">
    <div>
      <div id="g" class="grid"></div>
      <div class="row">
        <button id="clear">Effacer</button>
        <button id="invert">Inverser</button>
      </div>
      <label class="f" for="size">Taille de la grille</label>
      <select id="size"><option value="8">8 × 8 (2 chiffres par ligne)</option><option value="16">16 × 16 (4 chiffres par ligne)</option></select>
      <label class="f" for="pre">Modèles</label>
      <select id="pre"><option value="">Choisir un modèle...</option>${Object.keys(PRESETS).map(k=>`<option>${k}</option>`).join('')}</select>
    </div>
    <div>
      <table><thead><tr><th>Binaire</th><th>Hexa</th><th>Décimal</th></tr></thead><tbody id="tb"></tbody></table>
      <label class="f">Code complet</label>
      <div class="code" id="full"></div>
    </div>
  </div>
  <div class="card">
    <label class="f" for="hexin">Saisir un code hexadécimal pour afficher le dessin</label>
    <input type="text" id="hexin" placeholder="3C 42 A5 81 A5 99 42 3C" autocomplete="off" spellcheck="false">
    <div class="row"><button id="draw">Afficher le dessin</button></div>
    <div id="hexmsg"></div>
  </div>
  <div class="card">
    <b>Lien défi pour les élèves</b>
    <p class="hint">L'élève ouvre le lien, voit les codes et une grille vide, colorie les cases, puis vérifie. Le dessin n'apparaît pas dans le lien en clair, mais il est lisible par quiconque sait décoder l'hexadécimal, ce qui est le but.</p>
    <input type="text" id="link" readonly>
    <div class="row"><button class="p" id="copy">Copier le lien</button></div>
    <div id="copymsg"></div>
  </div>`;
  $('#size').value = String(N);
  const refresh = () => {
    $('#tb').innerHTML = cells.map(r => `<tr><td class="m">${rowBin(r)}</td><td class="hx">${rowHex(r)}</td><td>${rowDec(r)}</td></tr>`).join('');
    $('#full').textContent = cells.map(rowHex).join(' ');
    $('#link').value = location.href.split('#')[0] + '#d=' + N + ':' + allHex(cells);
  };
  const redraw = () => { buildGrid($('#g'), N, cells, {onChange: refresh}); refresh(); };
  redraw();
  $('#clear').onclick = () => { cells = blank(N); redraw(); };
  $('#invert').onclick = () => { cells = cells.map(r => r.map(b => 1-b)); redraw(); };
  $('#size').onchange = e => { N = +e.target.value; cells = blank(N); redraw(); };
  $('#pre').onchange = e => {
    const p = PRESETS[e.target.value]; if (!p) return;
    N = 8; $('#size').value = '8'; cells = fromPattern(p); redraw(); e.target.value = '';
  };
  $('#draw').onclick = () => {
    const c = parseHex($('#hexin').value, N);
    const m = $('#hexmsg');
    if (!c){ m.innerHTML = `<div class="msg ko">Il faut exactement ${N*N/4} chiffres hexadécimaux (0 à 9, A à F) pour une grille ${N} × ${N}.</div>`; return; }
    cells = c; m.innerHTML = ''; redraw();
  };
  $('#copy').onclick = async () => {
    const f = $('#link');
    try { await navigator.clipboard.writeText(f.value); $('#copymsg').innerHTML = '<div class="msg ok">Lien copié.</div>'; }
    catch { f.select(); $('#copymsg').innerHTML = '<div class="msg ok">Lien sélectionné, copiez-le avec Ctrl+C.</div>'; }
  };
}

/* ---------- Mode élève ---------- */
function renderStudent(n, target){
  const mine = blank(n);
  $('#title').textContent = "Le dessin caché";
  $('#sub').textContent = `Chaque chiffre hexadécimal donne 4 cases : 0 = blanc, 1 = noir. Le trait orange sépare les ${n/4 === 1 ? 'chiffres' : 'groupes de 4 cases'} d'une ligne.`;
  $('#app').innerHTML = `
  <div class="card cols">
    <div>
      <div id="g" class="grid"></div>
      <div class="row">
        <button class="p" id="check">Vérifier</button>
        <button id="clear">Effacer</button>
        <button id="solve">Voir la solution</button>
      </div>
      <div id="msg"></div>
    </div>
    <div>
      <table><thead><tr><th>Ligne</th><th>Code hexa</th></tr></thead><tbody>${target.map((r,i)=>`<tr><td>${i+1}</td><td class="hx">${rowHex(r)}</td></tr>`).join('')}</tbody></table>
      <details><summary>Aide : table de conversion</summary>
        <table><tbody>${[...HX].map((h,k)=>`<tr><td class="hx">${h}</td><td>${k}</td><td class="m">${k.toString(2).padStart(4,'0')}</td></tr>`).join('')}</tbody></table>
      </details>
    </div>
  </div>`;
  const draw = () => buildGrid($('#g'), n, mine, {});
  draw();
  $('#clear').onclick = () => { mine.forEach(r => r.fill(0)); $('#msg').innerHTML=''; draw(); };
  $('#check').onclick = () => {
    const cs = $('#g').children; let bad = 0;
    for (let i=0;i<n;i++) for (let j=0;j<n;j++){
      const wrong = mine[i][j] !== target[i][j];
      cs[i*n+j].classList.toggle('bad', wrong);
      if (wrong) bad++;
    }
    $('#msg').innerHTML = bad === 0
      ? '<div class="msg ok">Parfait, le dessin est correct.</div>'
      : `<div class="msg ko">${bad} case${bad>1?'s':''} à corriger (entourée${bad>1?'s':''} en rouge). Revérifiez les lignes concernées.</div>`;
  };
  $('#solve').onclick = () => {
    for (let i=0;i<n;i++) mine[i] = target[i].slice();
    $('#msg').innerHTML = '<div class="msg ok">Voici la solution.</div>';
    draw();
  };
}

function route(){
  const m = location.hash.match(/^#d=(8|16):([0-9A-Fa-f]+)$/);
  if (m){
    const n = +m[1], c = parseHex(m[2], n);
    if (c) return renderStudent(n, c);
  }
  renderTeacher();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
